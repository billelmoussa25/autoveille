# --- Reglages generaux -------------------------------------------------------
general:
  intervalle_minutes: 25          # frequence de passage du collecteur

# --- Zone geographique -------------------------------------------------------
zone:
  # Melange libre de regions et de departements.
  # Regions disponibles : idf, hauts_de_france, grand_est, normandie, bretagne,
  # pays_de_la_loire, centre_val_de_loire, bourgogne_franche_comte,
  # nouvelle_aquitaine, occitanie, auvergne_rhone_alpes, paca, corse
  # Exemples : ["idf"]  |  ["idf", "60", "27", "45"]  |  ["idf", "hauts_de_france"]
  # Une liste vide ne filtre rien.
  departements: ["idf", "60", "27"]

  # Que faire d'une annonce dont le code postal n'est pas lisible.
  # true = on la garde, quitte a avoir du bruit.
  garder_si_inconnu: true

  # Nombre minimum d'annonces comparables en base avant d'oser calculer
  # un prix de reference. En dessous, l'annonce est stockee mais pas notifiee.
  comparables_minimum: 8


# --- Alerteur "saines" : voitures roulantes sous le marche --------------------
alertes_saines:
  actif: true
  intervalle_minutes: 5           # frequence de relecture de la base
  seuil_alerte: 0.12              # 0.12 = 12 % sous le prix median
  prix_plancher: 800              # en dessous, on ne notifie pas
  # Variable d'environnement contenant l'identifiant de conversation Telegram
  telegram_chat: TELEGRAM_CHAT_ID_SAINES

# --- Alerteur "a reparer" : vehicules HS et tres bas prix ---------------------
alertes_hs:
  actif: true
  intervalle_minutes: 5
  marge_minimum: 1200             # marge estimee declenchant l'alerte
  # Filet supplementaire : toute annonce sous ce prix passe, meme sans panne
  # identifiee et meme sans assez de comparables pour calculer une marge.
  prix_coup_de_filet: 1000
  telegram_chat: TELEGRAM_CHAT_ID_HS

