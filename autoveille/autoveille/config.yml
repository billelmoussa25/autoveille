# --- Vehicules a reparer et revendre -----------------------------------------
reparation:
  # Decote appliquee a la revente d'un vehicule remis en route par rapport a
  # un vehicule sain de meme millesime : historique moins net, pas de suivi.
  decote_revente: 0.12

  # Fourchettes de cout, pieces et main d'oeuvre. REMPLACE-LES par tes couts
  # reels : ce sont les chiffres qui decident si l'affaire vaut le coup.
  # L'ordre compte : la premiere panne qui correspond est retenue, donc du
  # plus grave au plus benin.
  pannes:
    moteur:
      motifs: ["moteur hs", "moteur cassé", "moteur casse", "moteur serré",
               "coule une bielle", "bielle coulée", "moteur à refaire"]
      cout_min: 1500
      cout_max: 3000
    joint_culasse:
      motifs: ["joint de culasse", "culasse", "jdc", "mayonnaise"]
      cout_min: 900
      cout_max: 1800
    boite:
      motifs: ["boîte hs", "boite hs", "boîte de vitesses hs", "bv hs",
               "passe plus les vitesses", "boîte cassée"]
      cout_min: 800
      cout_max: 1800
    accident:
      motifs: ["accidenté", "accidente", "choc avant", "choc arrière",
               "carrosserie à refaire", "tolerie"]
      cout_min: 800
      cout_max: 3000
    embrayage:
      motifs: ["embrayage", "volant moteur", "butée", "patine"]
      cout_min: 450
      cout_max: 1100
    distribution:
      motifs: ["distribution", "courroie", "chaîne de distribution"]
      cout_min: 350
      cout_max: 800
    turbo:
      motifs: ["turbo", "geometrie variable", "géométrie variable"]
      cout_min: 500
      cout_max: 1100
    injection:
      motifs: ["injecteur", "pompe à injection", "pompe injection", "rampe"]
      cout_min: 400
      cout_max: 1200
    fap_egr:
      motifs: ["fap", "filtre à particules", "vanne egr", "egr", "catalyseur"]
      cout_min: 300
      cout_max: 1000
    electrique:
      motifs: ["démarreur", "alternateur", "batterie", "faisceau", "calculateur"]
      cout_min: 150
      cout_max: 700
    controle_technique:
      motifs: ["ct refusé", "ct refuse", "contre-visite", "sans ct",
               "controle technique refusé"]
      cout_min: 300
      cout_max: 1200
    # Retenue quand le vehicule est annonce HS sans que la panne soit precisee.
    # Fourchette large exprès : c'est le cas le plus risque.
    indetermine:
      motifs: []
      cout_min: 400
      cout_max: 2000

# --- Sources -----------------------------------------------------------------
sources:
  lacentrale:
    actif: true
    # Pause entre deux requetes, en secondes. Ne descends pas sous 8.
    pause_secondes: 12

  # Lit les mails d'alerte des recherches sauvegardees leboncoin dans une
  # boite IMAP. C'est la seule voie automatique vers leboncoin : aucun acces
  # au site, donc rien qui puisse etre bloque.
  mails_leboncoin:
    actif: true
    expediteur: "leboncoin.fr"
